{{extends 'base.html'}}

{% block content %}
  <h1>Partite</h1>
  <h2>{{ gioco['nome'] }}</h2>

    <ul>
        {% for partita in partite %}
        <li><a href="{{ url_for('partita_detail', partita_id=partita['id']) }}">{{ partita['data'] }} - {{ partita['vincitore'] }} ({{ partita['punteggio_vincitore'] }} punti)</a></li>
        {% endfor %}

    </ul>
    <p><a href="{{ url_for('crea_partita', gioco_id=gioco['id']) }}">Crea nuova partita</a></p>

{% endblock %}
