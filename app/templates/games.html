{{extends 'base.html'}}

{% block content %}

  <h1>Games</h1>

  <ul>
    {% for gioco in giochi %}
      <li><a href="{{ url_for('gioco_detail', gioco_id=gioco['id']) }}">{{ gioco['nome'] }}</a></li>
    {% endfor %}
  </ul>

  <p><a href="{{ url_for('create_gioco') }}">Create new game</a></p>

{% endblock %}
